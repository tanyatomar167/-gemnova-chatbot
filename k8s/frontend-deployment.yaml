apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemnova-frontend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: gemnova-frontend

  template:
    metadata:
      labels:
        app: gemnova-frontend

    spec:
      containers:
        - name: frontend
          image: gemnova-frontend:latest

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: gemnova-frontend-service

spec:
  selector:
    app: gemnova-frontend

  ports:
    - port: 80
      targetPort: 80

  type: LoadBalancer